<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大喜利デュエル</title>
  <!-- 既存CSS（そのまま） -->
  <link rel="stylesheet" href="/static/css/style_duel.css" />
  <style>
    /* =========================================================
       New Look（既存ID/構造は保持）— ダーク＋モダンUI
       ========================================================= */
    :root{
      --bg: #0b0e14;
      --bg-elev: #121826;
      --card: #121623;
      --card-2:#0f1420;
      --line: #22293b;
      --line-2:#2a3042;
      --txt: #e8eaf0;
      --txt-weak:#a8b0c2;
      --accent:#3a63ff;
      --accent-2:#2b5cff;
      --pill:#1a2030;
      --ok:#2ecc71;
      --warn:#ffb020;
      --danger:#ff5d5d;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
      --radius-lg: 18px;
      --radius-sm: 10px;
      --gap: 12px;
    }

    /* ====== Base ====== */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--txt);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(58,99,255,.12), transparent 55%),
        radial-gradient(1000px 520px at -10% 10%, rgba(49,80,210,.10), transparent 60%),
        var(--bg);
      letter-spacing: .2px;
    }

    a { color: inherit; }

    /* ====== Header ====== */
    header{
      position: sticky; top: 0; z-index: 10;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px;
      background: linear-gradient(180deg, #0b0e14 0%, rgba(11,14,20,.85) 80%, rgba(11,14,20,.00));
      border-bottom: 1px solid var(--line);
      backdrop-filter: saturate(1.1) blur(6px);
    }
    .brand{
      display:flex; align-items:center; gap:10px; font-weight:800;
      letter-spacing:.4px;
    }
    .logo-dot{
      width:22px; height:22px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #fff 0 2px, transparent 2px) ,
                  conic-gradient(from 120deg, #5e7bff, #4a64ff 30%, #2b5cff 55%, #6f8bff);
      box-shadow: 0 6px 18px rgba(67,96,255,.5);
      border:1px solid #6c83ff55;
    }
    .title{ font-size:16px; font-weight:800; }
    .hdr-right{ display:flex; align-items:center; gap:10px; }
    .pill { background: var(--pill); border:1px solid #2b3550; padding:6px 10px; border-radius:999px; font-size:12px; color:var(--txt-weak);}
    .muted{ color: var(--txt-weak); font-size:12px; }

    /* ====== Layout ====== */
    .container{ max-width: 980px; margin: 20px auto 28px; padding: 0 16px; }
    .section-title{ margin: 0 0 8px; font-size:22px; letter-spacing:.4px; }

    /* ====== Card ====== */
    .card{
      background: linear-gradient(180deg, #131827, #111624);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .subcard{ background: var(--card-2); border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: 12px; }
    .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .list{ display:flex; flex-direction:column; gap:8px; }

    /* ====== Form / Controls ====== */
    input, select, button, textarea{
      background: #0f1420;
      color: var(--txt);
      border:1px solid var(--line-2);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease, transform .04s ease;
    }
    input:focus, select:focus, textarea:focus{
      border-color: #496aff;
      box-shadow: 0 0 0 3px rgba(73,106,255,.22);
    }
    textarea{ width:100%; min-height: 92px; resize: vertical; }

    button{ cursor:pointer; user-select:none; font-weight:700; }
    button:hover{ transform: translateY(-1px); }
    .primary{
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-color: #244dff;
      color: white;
      box-shadow: 0 6px 18px rgba(60,95,255,.35), inset 0 -6px 12px rgba(0,0,0,.18);
    }
    .primary:active{ transform: translateY(0); }
    .ghost{ background: transparent; color: var(--txt); }
    .danger{ background:#2a1012; border-color:#52252a; color:#ff8c8c; }

    /* ====== Grids ====== */
    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 760px){
      .grid{ grid-template-columns: 1fr; }
      .hdr-right{ gap:8px; }
      .container{ padding: 0 12px; }
      .primary, .ghost, button{ width: 100%; }
      #roomCodeInput, #nameInput, #capacitySelect{ flex:1; }
    }

    /* ====== Room / Members ====== */
    .member{
      display:flex; align-items:center; justify-content:space-between;
      background:#0e1320; border:1px solid #222b42; padding:10px 12px; border-radius:10px;
    }
    .room-code{ font-variant-numeric: tabular-nums; font-size:22px; letter-spacing:2px; }

    /* ====== Game ====== */
    .prompt-img{
      width:100%; border-radius:14px; border:1px solid #2b3550; max-height:460px; object-fit:cover; background:#0e1320;
    }
    .credit{ margin-top:6px; font-size:12px; color:#9aa2b6; }
    .answer{ background:#0e1320; border:1px solid #222b42; padding:10px 12px; border-radius:10px; }

    /* ====== Badges ====== */
    .status-wait{ background:#16202f; border-color:#22324a; color:#b9c6e7; }
    .status-live{ background:#0f2a1a; border-color:#1f5a38; color:#9be7b3; }
    .status-overtime{ background:#2b1c0a; border-color:#5a3a16; color:#ffd08a; }

    /* ====== Utility ====== */
    .hidden{ display:none !important; }

    /* ====== IPPON / Score Pop（既存JS用） ====== */
    .answer-item{ position: relative; overflow: visible; }
    .ippon-burst{
      position:absolute; inset:-8px -12px; display:grid; place-items:center; pointer-events:none; z-index:3;
      font-weight:900; font-size: clamp(28px, 5.6vw, 56px); letter-spacing:.08em;
      color:#ffe27a; -webkit-text-stroke: 2px #8a5a00;
      text-shadow:0 2px 0 #000, 0 4px 12px rgba(0,0,0,.6);
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.45));
      animation: ippon-pop 900ms cubic-bezier(.2,1,.2,1) forwards;
      white-space:nowrap; user-select:none;
    }
    @keyframes ippon-pop{
      0%{transform:scale(.4) rotate(-6deg);opacity:0}
      18%{transform:scale(1.15) rotate(1.5deg);opacity:1}
      32%{transform:scale(1.0) rotate(0deg)}
      70%{opacity:1}
      100%{transform:scale(.92) translateY(-6px);opacity:0}
    }
    .score-pop{
      position:absolute; right:12px; top:-4px; z-index:2; padding:4px 8px; border-radius:10px; font-weight:700; font-variant-numeric:tabular-nums;
      background:#0b1220; border:1px solid #2a3658; color:#a9c1ff; box-shadow:0 6px 14px rgba(0,0,0,.3);
      animation: score-pop-in 800ms cubic-bezier(.2,1,.2,1) forwards;
    }
    @keyframes score-pop-in{
      0%{transform:translateY(-6px) scale(.9);opacity:0}
      40%{transform:translateY(0) scale(1.05);opacity:1}
      100%{transform:translateY(-6px) scale(1);opacity:0}
    }

    /* ====== AB評価モーダル ====== */
    .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:1000; }
    .modal{ position:fixed; inset:0; display:none; place-items:center; z-index:1001; }
    .modal.show, .modal-backdrop.show{ display:grid; }
    .modal-card{
      width:min(980px, 96vw);
      background: linear-gradient(180deg, #131827, #111624);
      border:1px solid var(--line);
      border-radius: var(--radius-lg);
      padding:16px;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
    }
    .ab-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .ab-step{ font-variant-numeric: tabular-nums; }
    .ab-prompt{ margin:8px 0 12px; font-size:16px; color:#c9cede; }
    .ab-img{ width:100%; border-radius:12px; border:1px solid #2b3550; max-height:360px; object-fit:cover; }
    .ab-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .ab-col{ background:#0e1320; border:1px solid #222b42; border-radius:12px; padding:12px; }
    .ab-col h4{ margin:0 0 6px; }
    .ab-controls{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    .btn-tie{ background:#263149; border-color:#263149; }
    .x{ cursor:pointer; font-size:18px; padding:8px 10px; border-radius:10px; background:#0f1420; border:1px solid #2a3042; }

    /* アニメ少なめ指定 */
    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
    }
  </style>

  <!-- socket.io（CDN→フォールバック） -->
  <script>
    (function(){
      var s=document.createElement('script');
      s.src="https://cdn.socket.io/4.7.5/socket.io.min.js";
      s.crossOrigin="anonymous";
      s.onload=function(){ window.__SOCKETIO_READY__=true; };
      s.onerror=function(){
        var f=document.createElement('script');
        f.src="/static/vendor/socket.io.min.js";
        f.onload=function(){ window.__SOCKETIO_READY__=true; };
        document.head.appendChild(f);
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <!-- ====== Header ====== -->
  <header>
    <div class="brand">
      <span class="logo-dot" aria-hidden="true"></span>
      <div class="title">大喜利デュエル</div>
    </div>
    <div class="hdr-right">
      <span class="pill">接続ID: <b id="mySid">-</b></span>
      <label class="muted" style="display:flex;align-items:center;gap:6px;">
        <input id="seToggle" type="checkbox" checked style="vertical-align:middle;"/> SE
      </label>
    </div>
  </header>

  <main class="container">
    <!-- ====== ロビー ====== -->
    <section id="lobby" class="card">
      <h2 class="section-title">ロビー</h2>

      <div class="row" style="margin-top:8px;">
        <input id="nameInput" type="text" placeholder="プレイヤー名（例：けんじ）" />
        <select id="capacitySelect">
          <option value="2" selected>2人対戦</option>
          <option value="3">3人対戦</option>
          <option value="4">4人対戦</option>
          <option value="5">5人対戦</option>
        </select>
        <button id="saveNameBtn" class="ghost">名前をセット</button>
      </div>

      <div class="grid" style="margin-top:16px;">
        <div class="subcard">
          <h3 style="margin:0 0 6px;">クイックマッチ</h3>
          <p class="muted" style="margin:0 0 8px;">2人が揃い次第、自動でマッチング（固定）。</p>
          <div class="row">
            <button id="joinQueueBtn" class="primary">クイックマッチ開始</button>
            <button id="cancelQueueBtn" class="ghost">取り消し</button>
            <span id="queueStatus" class="pill status-wait">待機していません</span>
          </div>
        </div>

        <div class="subcard">
          <h3 style="margin:0 0 6px;">ルームコード</h3>
          <div class="row">
            <button id="createRoomBtn" class="primary">ルーム作成</button>
            <span class="muted"> or </span>
            <input id="roomCodeInput" type="text" placeholder="招待コード（ABCD）" style="text-transform:uppercase;" />
            <button id="joinRoomBtn" class="ghost">参加</button>
          </div>
          <p class="muted" style="margin-top:8px;">友だちと遊ぶときはルーム作成→コード共有→参加。</p>
        </div>
      </div>
    </section>

    <!-- ====== ルーム ====== -->
    <section id="roomCard" class="card hidden">
      <div class="row" style="justify-content:space-between;">
        <h2 class="section-title" style="margin:0;">ルーム</h2>
        <div class="row">
          <span id="roomStatusPill" class="pill status-wait">waiting</span>
          <button id="leaveRoomBtn" class="ghost">退室</button>
        </div>
      </div>

      <div style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;">
        <div>コード: <span id="roomCode" class="room-code">----</span></div>
        <div>定員: <span id="roomCapacity">-</span></div>
      </div>

      <div class="list" id="memberList" style="margin-top:12px;"></div>
      <div class="row" style="margin-top:12px;"><span id="roomMessage" class="muted"></span></div>
    </section>

    <!-- ====== ゲーム ====== -->
    <section id="gameCard" class="card hidden">
      <div class="row" style="justify-content:space-between;">
        <h2 class="section-title" style="margin:0;">本戦 <span id="roundNo">1</span></h2>
        <span class="pill">残り <span id="countdown">--:--</span></span>
      </div>

      <div id="suddenBanner" class="pill hidden status-overtime" style="margin-top:8px;">サドンデス：次の一本で勝利！</div>

      <div style="margin-top:8px;">
        <!-- 画像お題（DOMは残すが常に非表示にする想定） -->
        <img id="promptImage" class="prompt-img hidden" alt="" />
        <div id="imgCredit" class="credit hidden"></div>
        <!-- テキストお題 -->
        <div id="promptText" style="font-size:20px; margin-top:8px;" class="hidden">—</div>
      </div>

      <div class="row" style="margin-top:12px; align-items:flex-start;">
        <!-- 左：自分の回答 -->
        <div style="flex:2; min-width:280px;">
          <textarea id="answerInput" placeholder="ここに書いて送信"></textarea>
          <div class="row" style="margin-top:8px;">
            <button id="submitAnswerBtn" class="primary">回答を送信</button>
          </div>
          <div id="myAnswers" class="list" style="margin-top:12px;"></div>
        </div>

        <!-- 右：提出一覧＋スコア -->
        <div style="flex:1; min-width:260px;">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <div class="muted">提出一覧（採点は即時表示）</div>
            <div id="skipBox" class="row">
              <button id="skipBtn" class="ghost">お題変更</button>
              <span id="skipStatus" class="muted">投票 0 / 0</span>
            </div>
          </div>
          <div id="roundPanel" class="list" style="margin-top:8px;"></div>

          <div class="subcard" style="margin-top:12px;">
            <div class="row" style="justify-content:space-between;">
              <b>スコアボード</b>
              <span class="muted">IPPON閾値: <b id="targetIppon">7.0</b></span>
            </div>
            <div id="scoreBoard" class="list" style="margin-top:8px;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ====== AB評価モーダル（ゲーム終了後に3ペア提示） ====== -->
  <div id="abBackdrop" class="modal-backdrop"></div>
  <div id="abModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="ab-head">
        <div>
          <b>AI改善にご協力を🙏（A/B評価）</b>
          <div class="muted">良いと思った方を選んでください（3ペア・同点ボタンあり／対戦結果には影響しません）</div>
        </div>
        <button id="abCloseBtn" class="x" title="閉じる">✕</button>
      </div>

      <div id="abContext">
        <div id="abModePill" class="pill" style="margin-top:8px;">テキストお題</div>
        <div id="abStep" class="ab-step muted" style="margin-left:8px;">1 / 3</div>
        <div id="abPromptWrap" class="ab-prompt hidden"></div>
        <!-- 画像はテキスト固定のため常にhidden（DOMは互換のため残す） -->
        <img id="abImage" class="ab-img hidden" alt="" />
      </div>

      <div class="ab-grid">
        <div class="ab-col">
          <h4>A</h4>
          <div id="abLeftText">—</div>
        </div>
        <div class="ab-col">
          <h4>B</h4>
          <div id="abRightText">—</div>
        </div>
      </div>

      <div class="ab-controls">
        <button id="abChooseA" class="primary">Aが上</button>
        <button id="abChooseB" class="primary">Bが上</button>
        <button id="abChooseTie" class="btn-tie">同点 / わからん</button>
      </div>
    </div>
  </div>

  <!-- 既存JS読み込み（変更なし） -->
  <script type="module" src="/static/js/score_animation.js"></script>
  <script type="module">
    function boot(){ import("/static/js/main.js"); }
    if (window.__SOCKETIO_READY__) { boot(); }
    else { const t=setInterval(()=>{ if(window.__SOCKETIO_READY__){ clearInterval(t); boot(); } }, 50); }
  </script>
</body>
</html>
