<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大喜利DUEL - ロビー</title>
</head>
<body>
  <h2>大喜利DUEL ロビー</h2>
  <label>ニックネーム</label>
  <input id="name" placeholder="ヤマグチ" />
  <label>部屋ID（例：room-1）</label>
  <input id="room" placeholder="room-1" />
  <button id="go">入室</button>
  <script>
    document.getElementById('go').onclick = () => {
      const name = encodeURIComponent(document.getElementById('name').value || '匿名');
      const room = encodeURIComponent(document.getElementById('room').value || 'room-1');
      location.href = `/duel/${room}?name=${name}`;
    };
  </script>
</body>
</html>
