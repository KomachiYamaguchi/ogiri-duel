<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>大喜利DUEL ロビー</title></head>
<body>
  <h1>大喜利DUEL ロビー</h1>
  <form onsubmit="goRoom(event)">
    <input id="name" placeholder="ニックネーム" value="ヤマグチ" required />
    <input id="room" placeholder="room-1 等" value="room-1" required />
    <button type="submit">入室</button>
  </form>
  <p><a href="/health" target="_blank">/health（動作確認用）</a></p>
  <script>
    function goRoom(e){
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const room = document.getElementById('room').value.trim();
      location.href = `/duel/${encodeURIComponent(room)}?name=${encodeURIComponent(name)}`;
    }
  </script>
</body>
</html>
