<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>大喜利DUEL - ロビー</title>
  <style>
    :root{--bg:#0f172a;--panel:#111827;--text:#e5e7eb;--muted:#9ca3af;--accent:#3b82f6;--accent-2:#60a5fa;--chip:#1f2937}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{max-width:760px;margin:24px auto;padding:0 16px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:#1e293b;font-weight:700}
    .title{font-size:20px;font-weight:800}
    .conn{margin-left:auto;padding:6px 10px;border-radius:999px;background:#0b1220;border:1px solid #263249;font-size:12px;color:#9fb4d3}
    .card{background:var(--panel);border:1px solid #1f2937;border-radius:16px;padding:16px;margin:16px 0}
    .row{display:flex;gap:8px;align-items:center;margin:8px 0}
    input,select,button{font-size:16px}
    input,select{flex:1;background:#0b1220;color:var(--text);border:1px solid #263249;border-radius:12px;padding:12px}
    button.primary{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 16px;font-weight:700}
    .muted{color:var(--muted);font-size:12px}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--chip);border:1px solid #263249;font-size:12px}
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">祭</div>
      <div class="title">大喜利DUEL<br><span class="muted">ロビー</span></div>
      <div id="conn" class="conn">接続: 未接続</div>
    </header>

    <div class="card">
      <div class="row">
        <input id="name" placeholder="例：ヤマグチ" />
        <button id="save" class="pill">保存</button>
      </div>
      <div class="muted">※ 自動保存（端末にのみ保存）</div>
      <div class="row" style="margin-top:8px">
        <select id="mode">
          <option value="2">2人対戦</option>
        </select>
        <span class="muted">※ サーバ未対応の場合は無視</span>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px 0">いま遊ぶ（クイックマッチ）</h3>
      <div class="row">
        <button id="quick" class="primary" style="width:100%">▶ クイックマッチ開始</button>
      </div>
      <div class="row">
        <span class="pill" id="waiting">0</span>
        <span class="pill">待機: 2人マッチ</span>
      </div>
      <div class="muted">※ サーバが未実装でも、成立したら対戦画面に即移動します。</div>
      <div class="row">
        <button id="cancel" class="pill">取り消し</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px 0">友だちと遊ぶ（コード参加）</h3>
      <div class="row">
        <input id="code" placeholder="ABCD" maxlength="4" />
        <button id="join" class="pill">参加</button>
      </div>
      <div class="muted">※ ルーム作成は相手側からコード共有→入力→参加。</div>
    </div>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const nameInput = $('#name');
  const conn = $('#conn');
  const waiting = $('#waiting');

  // ---- name keep ----
  const savedName = localStorage.getItem('ogiri_name') || '';
  if(savedName) nameInput.value = savedName;
  $('#save').onclick = () => {
    localStorage.setItem('ogiri_name', nameInput.value.trim() || '匿名');
  };

  // ---- socket ----
  const socket = io({transports:['websocket','polling']});
  socket.on('connect', () => {
    conn.textContent = '接続: 接続済み';
    const n = (nameInput.value || '匿名').trim();
    socket.emit('set_name', {name: n});
  });
  socket.on('disconnect', () => conn.textContent = '接続: 未接続');

  // 待機人数
  socket.on('waiting_count', (p)=> { waiting.textContent = (p && p.count||0); });

  // クイックマッチ → サーバへ
  $('#quick').onclick = () => {
    const n = (nameInput.value || '').trim() || '匿名';
    localStorage.setItem('ogiri_name', n);
    socket.emit('set_name', {name:n});
    socket.emit('quick_match_join', {});
  };
  $('#cancel').onclick = () => socket.emit('quick_match_cancel');

  // マッチ成立 → 余計なページを挟まず /duel に直行
  socket.on('quick_match_assigned', ({room}) => {
    const n = encodeURIComponent(localStorage.getItem('ogiri_name') || nameInput.value || '匿名');
    location.href = `/duel/${room}?name=${n}`;
  });

  // 互換: サーバからの一般イベント（あっても無くてもOK）
  socket.on('queue_joined', ()=>{/* no-op */});
  socket.on('matched', ()=>{/* room broadcast; ロビーでは未使用 */});

  // コード参加
  $('#join').onclick = () => {
    const code = ($('#code').value || '').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    if(!code){ alert('コードを入力'); return; }
    // ロビー側からはまず /duel へ移動して、対戦ページのUI/ソケットでハンドリング
    const n = encodeURIComponent(localStorage.getItem('ogiri_name') || nameInput.value || '匿名');
    location.href = `/duel/${code}?name=${n}`;
  };
})();
</script>
</body>
</html>
